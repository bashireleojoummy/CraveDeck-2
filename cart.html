<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | CraveDeck</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">CRAVEDECK</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Our Menu</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-warning ms-lg-3" href="cart.html">
                            My Cart 🛒
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Shopping Cart -->
    <section class="container py-5">
        <div class="text-center mb-5">
            <p class="text-uppercase">Your delicious selections</p>
            <h1>Your Shopping Cart</h1>
            <p>Review your order before checking out.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-9">

                <div class="cart-section">
                    <div id="cartItems"></div>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center">
                        <h3>Total:</h3>
                        <h3 id="cartTotal">₦0</h3>
                    </div>

                    <div class="d-flex flex-wrap gap-3 mt-4">
                        <a href="menu.html" class="btn btn-outline-light">
                            Continue Shopping
                        </a>

                        <a href="checkout.html" class="btn btn-warning">
                            Proceed to Checkout
                              </a>
                    </div>

                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center py-4">
        <p>&copy; <span id="currentYear"></span> CraveDeck. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
